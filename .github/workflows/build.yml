name: Build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore DiscForgeStudio.App.csproj -r win-x64
      - run: dotnet build DiscForgeStudio.App.csproj -c Release -r win-x64 --no-restore
      - run: dotnet publish DiscForgeStudio.App.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifacts/app
      - run: dotnet publish UpdaterSource/DiscForgeUpdater.csproj -c Release -r win-x64 --self-contained true -o artifacts/updater
      - uses: actions/upload-artifact@v4
        with:
          name: DiscForge-Studio-win-x64
          path: artifacts/
