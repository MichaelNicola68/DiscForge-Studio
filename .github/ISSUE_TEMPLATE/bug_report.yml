name: Fehlerbericht
description: Reproduzierbaren Fehler melden
title: "[Fehler] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes: { label: DiscForge-Version }
    validations: { required: true }
  - type: input
    id: windows
    attributes: { label: Windows-Version }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Schritte zur Reproduktion }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Erwartetes Verhalten }
    validations: { required: true }
  - type: textarea
    id: actual
    attributes: { label: Tatsächliches Verhalten }
    validations: { required: true }
